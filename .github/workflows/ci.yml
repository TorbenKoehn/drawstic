name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build dist
        run: bun run build

      # Smoke-test the built dist under Node (not Bun) to prove Node >= 20 support.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Node smoke test
        run: |
          node dist/bin.js help
          node dist/bin.js render examples/basic-shapes/circles.drw#circleIcon --out /tmp/ci-circle.png
          test -s /tmp/ci-circle.png && echo "rendered $(wc -c < /tmp/ci-circle.png) bytes"

      # Catches a broken files/exports/bin/shebang before it reaches users:
      # packs the real tarball, installs it into a scratch project like a
      # consumer would, and runs the CLI under Node (not Bun). Mirrors the
      # release.yml pre-publish smoke test so packaging regressions fail on PRs.
      - name: Packed tarball smoke test (Node, not Bun)
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d)"
          npm pack --pack-destination "$SMOKE_DIR"
          TARBALL="$(ls "$SMOKE_DIR"/drawstic-*.tgz)"
          pushd "$SMOKE_DIR" >/dev/null
          npm init -y >/dev/null
          npm install "$TARBALL"
          npx drawstic help
          printf 'draw tinyIcon 4x4:\n  bg #ff0000\n' > tiny.drw
          npx drawstic render tiny.drw#tinyIcon --out tiny.png
          test -s tiny.png
          echo "packed CLI smoke OK: $(wc -c < tiny.png) bytes"
          popd >/dev/null

  # Coverage gate: enforces bunfig.toml's coverageThreshold (bun test exits
  # non-zero below it) and surfaces the per-file table on the PR — both as a
  # job summary and a sticky comment, so reviewers see it without opening logs.
  coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Threshold enforcement happens here (bun exits non-zero below
      # bunfig.toml's coverageThreshold); continue-on-error so the summary
      # and PR comment steps below still run, then the final step fails the
      # job for real based on the recorded outcome.
      - name: Run coverage
        id: coverage
        continue-on-error: true
        run: |
          bun test --coverage 2>&1 | tee coverage-output.txt
          exit ${PIPESTATUS[0]}

      - name: Write coverage to job summary
        if: always()
        run: |
          {
            echo "### Coverage (\`bun test --coverage\`)"
            echo
            echo '```'
            cat coverage-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Forks: GITHUB_TOKEN is read-only on pull_request from a fork, so this
      # 403s — continue-on-error keeps that from failing the job.
      - name: Comment coverage on PR
        if: always()
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: coverage
          path: coverage-output.txt
          message: |
            ### Coverage (`bun test --coverage`)
            ```
            {{{content}}}
            ```

      - name: Fail if coverage thresholds were not met
        if: always()
        run: |
          if [ "${{ steps.coverage.outcome }}" != "success" ]; then
            echo "Coverage run failed or thresholds not met — see the job summary above."
            exit 1
          fi
