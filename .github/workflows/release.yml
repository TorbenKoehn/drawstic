name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify (lint, typecheck, test)
        run: |
          bun run lint
          bun run typecheck
          bun test

      - name: Build dist
        run: bun run build

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Stamp version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Catches a broken files/exports/bin/shebang before it reaches users:
      # packs the real tarball, installs it into a scratch project like a
      # consumer would, and runs the CLI under Node (not Bun).
      - name: Pre-publish packaging smoke test (Node, not Bun)
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d)"
          npm pack --pack-destination "$SMOKE_DIR"
          TARBALL="$(ls "$SMOKE_DIR"/drawstic-*.tgz)"
          pushd "$SMOKE_DIR" >/dev/null
          npm init -y >/dev/null
          npm install "$TARBALL"
          npx drawstic help
          printf 'draw tinyIcon 4x4:\n  bg #ff0000\n' > tiny.drw
          npx drawstic render tiny.drw#tinyIcon --out tiny.png
          test -s tiny.png
          echo "packed CLI smoke OK: $(wc -c < tiny.png) bytes"
          popd >/dev/null

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
