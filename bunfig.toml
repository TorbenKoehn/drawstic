[test]
# Coverage is opt-in (`bun test --coverage` / `bun run test:coverage`) so plain
# `bun test` stays fast for dev; CI's coverage job enforces the thresholds below.
# Bun 1.3.9 enforces coverageThreshold against file rows in practice, not just
# the aggregate row. Keep these floors just under the current legitimate low
# outlier: framebuffer.ts at ~87.70% lines / 70.00% functions.
coverageThreshold = { lines = 0.876, functions = 0.699 }
coverageSkipTestFiles = true
coverageReporter = ["text", "lcov"]
